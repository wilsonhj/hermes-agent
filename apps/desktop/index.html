<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy. SOURCE OF TRUTH: electron/content-security-policy.ts —
      this tag is `buildContentSecurityPolicy('development')`, verbatim, and
      content-security-policy.test.ts fails if the two ever drift.

      This static tag carries the DEVELOPMENT policy because the same file is
      served by the Vite dev server and shipped as the packaged file:// index,
      and the dev server needs one extra inline-script hash (React Fast
      Refresh). The main process narrows it to the production policy at runtime
      via a response header — a second policy can only ever narrow this one — so
      a packaged build is strict while `npm run dev` still works.

      The inline theme bootstrap below is allowed BY HASH; editing that script
      (even a comment) invalidates the hash. See the module for how to refresh it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-thP3Xi4D3xLhY5XYiK6vCmNBel4nusdd7+E9sSYH7cI=' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk=' https://platform.twitter.com https://www.instagram.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: hermes-media: https: http:; media-src 'self' data: blob: hermes-media: https: http:; connect-src 'self' data: blob: hermes-media: https: http: ws: wss:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://www.instagram.com https://assets.pinterest.com https://www.tiktok.com https://open.spotify.com https://maps.google.com https://www.google.com https://www.openstreetmap.org https://platform.twitter.com https://syndication.twitter.com; worker-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />
    <title>Hermes</title>
    <script>
      // Pre-paint the themed background before the app bundle loads. Without
      // this, the first frame (which is what `ready-to-show` waits for) is the
      // UA-default white page, and the real theme only lands once the whole
      // module graph has executed — i.e. the "white flash" on every new
      // window. applyTheme() in src/themes/context.tsx keeps these keys fresh.
      try {
        let bg = localStorage.getItem('hermes-boot-background')
        let scheme = localStorage.getItem('hermes-boot-color-scheme')
        if (!bg) {
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          bg = dark ? '#111111' : '#f7f7f7'
          scheme = dark ? 'dark' : 'light'
        }
        document.documentElement.style.backgroundColor = bg
        if (scheme === 'dark' || scheme === 'light') {
          document.documentElement.style.colorScheme = scheme
        }
      } catch {
        // localStorage unavailable — keep UA defaults.
      }
    </script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
